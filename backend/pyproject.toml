[project]
name = "kopertly-backend"
version = "0.0.0"
description = "API aplikacji Kopertly (FastAPI)"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.165.0",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.16.3",
    "sqlmodel>=0.0.50",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
